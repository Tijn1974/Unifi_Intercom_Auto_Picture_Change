tant && haGlobal.homeAssistant.states) {\n        // Fallback\n        let weatherSensor = haGlobal.homeAssistant.states[\"weather.forecast_home\"];\n        if (weatherSensor) {\n            currentCondition = (weatherSensor.state || \"\").toLowerCase();\n        }\n    }\n\n    // Connecting the weather conditions to the right picture.\n    if (currentCondition.includes(\"rain\") || currentCondition.includes(\"pour\")) selectedImage = images.rainy;\n    else if (currentCondition.includes(\"cloud\") || currentCondition.includes(\"partly\")) selectedImage = images.cloudy;\n    else if (currentCondition.includes(\"snow\")) selectedImage = images.snowy;\n    else if (currentCondition.includes(\"sun\") || currentCondition.includes(\"clear\")) selectedImage = images.sunny;\n    else {\n        selectedImage = images.cloudy; // Standaard fallback\n    }\n}\n\n// Check if the picture has changed in compare with the previous one.\nlet lastImage = context.get(\"lastImage\") || \"\";\n\nif (selectedImage === lastImage) {\n    // No picture change, stop the flow to prefent unnecessery API calls\n    //node.status({ fill: \"grey\", shape: \"ring\", text: \"No change: \" + currentCondition + \" \" + selectedImage.split('_')[1].substring(0, 8) });\n    node.status({ fill: \"grey\", shape: \"ring\", text: \"No change, currently: \" + currentCondition + \" \" });\n    return null;\n}\n\n// Save picture state and send payload\ncontext.set(\"lastImage\", selectedImage);\nnode.status({ fill: \"green\", shape: \"dot\", text: \"New picture: \" + currentCondition });\n\nmsg.chosenIntercomImage = selectedImage;\nreturn msg;","outputs":1,"timeout":0,"noerr":0,"initialize":"","finalize":"","libs":[],"x":660,"y":120,"wires":[["61bacdc06547e2b9"]]},{"id":"61bacdc06547e2b9","type":"function","z":"f1347943bd89dc42","name":"1. Local Login","func":"msg.payload = {\n    \"username\": \"Created UDMPro account in step 1\",\n    \"password\": \"YoUr_PaSsWoRd\"\n};\nreturn msg;","outputs":1,"timeout"